name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
        continue-on-error: false
      
      - name: Check test coverage
        run: npm run test:coverage
        continue-on-error: false
      
      # shell: bash runs with -eo pipefail, so a failing vite build fails the step
      # through the tee. check-build-log.mjs ignores file/asset names (a chunk called
      # AIErrorLine-xxxx.js is not an error); pinned by scripts/__tests__/checkBuildLog.test.ts.
      - name: Build (must succeed with zero warnings)
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          node scripts/check-build-log.mjs build.log
      
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: false
      
      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: false
      
      - name: Check for duplicate keys
        run: |
          echo "Checking for duplicate keys in TypeScript files..."
          if grep -r "Duplicate key" components/ services/ hooks/ src/ 2>&1 | grep -q "Duplicate"; then
            echo "❌ Duplicate keys detected in object literals"
            exit 1
          fi
          echo "✅ No duplicate keys found"
