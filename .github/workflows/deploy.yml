name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # A cached index.html (max-age=600) still asks for the previous bundles after a
      # deploy; without them the site renders blank. Keeps exactly one generation.
      - name: Keep the previous deploy's assets one more round
        run: |
          git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages || true
          scripts/carry-previous-assets.sh dist refs/remotes/origin/gh-pages

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # false: each deploy replaces gh-pages, so old bundles (which once carried
          # build-time API keys) do not linger on the site. PR previews under
          # preview/ are recreated by preview.yml on their next push.
          keep_files: false
          # One fresh commit per deploy: gh-pages never accumulates history, so nothing
          # an old build contained stays reachable in the branch (2026-10-06 history clean-up).
          force_orphan: true
          cname: scripturetolife.org
