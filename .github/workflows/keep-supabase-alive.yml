name: Keep Supabase Alive

# The free Supabase plan pauses a project after ~7 days without activity, and a
# paused project is deleted if it stays paused (that is how the previous project
# was lost in 2026). This pings the live project once a day. GitHub turns
# scheduled workflows off after 60 days without commits — if it shows
# "disabled_inactivity" in the Actions tab, re-enable it there.
# The in-database Tue/Thu/Sat check-in jobs (database/checkin-cron-schema.sql)
# also call the API three times a week, a second line of defence.

on:
  schedule:
    - cron: '17 15 * * *'   # daily, 15:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (REST read of pack_summaries; RLS returns [] to anon, which still counts as activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/pack_summaries?select=pack_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "000")
          echo "Supabase responded $code"
          # A failure here makes GitHub email the repo owner — the warning we need before a pause.
          [ "$code" = "200" ] || { echo "::error::Supabase did not answer 200 (got $code) — check the project in the Supabase dashboard"; exit 1; }
