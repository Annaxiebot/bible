            },

    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .font-serif-sc {
            font-family: 'Noto+Serif+SC', serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* TV verse popup + Ask-AI conversation: thin theme-colored scrollbar (last resort) */
        .tv-thin-scroll {
            scrollbar-width: thin;
            scrollbar-color: var(--stl-text-3) var(--stl-surface);
        }
        .tv-thin-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .tv-thin-scroll::-webkit-scrollbar-thumb {
            background: var(--stl-text-3);
            border-radius: 8px;
        }
        .prose {
            max-width: none;
        }
        .prose p {
            margin-top: 0.5em;
            margin-bottom: 0.5em;
        }
        .prose p:first-child {
            margin-top: 0;
        }
        .prose p:last-child {
            margin-bottom: 0;
        }
        .katex-display {
            margin: 0.5em 0;
            overflow-x: auto;
            overflow-y: hidden;
        }
        canvas {
          touch-action: none;
        }
        
        /* Annotation mode: completely disable all text selection and iOS callouts */
        html.annotation-mode-active,
        html.annotation-mode-active body,
        html.annotation-mode-active * {
          -webkit-touch-callout: none !important;
          -webkit-user-select: none !important;
          -moz-user-select: none !important;
          -ms-user-select: none !important;
          user-select: none !important;
          -webkit-tap-highlight-color: transparent !important;
        }
        
        /* Prevent iOS magnifier glass and text selection handles */
        html.annotation-mode-active input,
        html.annotation-mode-active textarea {
          pointer-events: none !important;
        }
        
        /* Block all touch behaviors on text content in annotation mode */
        html.annotation-mode-active .verse-content {
          pointer-events: none !important;
          touch-action: none !important;
        }
        
        /* Ensure the annotation canvas captures ALL touches */
        html.annotation-mode-active .annotation-overlay {
          pointer-events: auto !important;
          touch-action: none !important;
        }
        
        /* Hide iOS selection elements */
        html.annotation-mode-active ::selection {
          background: transparent !important;
        }
        html.annotation-mode-active ::-moz-selection {
          background: transparent !important;
        }
        
        /* Disable iOS text size adjustment which can cause selection issues */
        html.annotation-mode-active {
          -webkit-text-size-adjust: none !important;
        }
        /* Book dropdown scrollbar styles */
        .book-dropdown-scroll {
          -webkit-overflow-scrolling: touch;
          position: relative;
        }
        .book-dropdown-scroll::-webkit-scrollbar {
          width: 8px;
        }
        .book-dropdown-scroll::-webkit-scrollbar-track {
          background: #f1f5f9;
          border-radius: 4px;
        }
        .book-dropdown-scroll::-webkit-scrollbar-thumb {
          background: #94a3b8;
          border-radius: 4px;
        }
        .book-dropdown-scroll::-webkit-scrollbar-thumb:hover {
          background: #64748b;
        }
        /* iOS specific 3-dots indicator */
        @supports (-webkit-touch-callout: none) {
          .book-dropdown-scroll::after {
            content: '⋮';
            position: absolute;
            right: 8px;
            bottom: 8px;
            color: #94a3b8;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            background: white;
            padding: 0 4px;
          }
        }
    </style>
